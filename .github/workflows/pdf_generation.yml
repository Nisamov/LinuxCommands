name: Generación de Documentación PDF Multilingüe

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [en, de, pt, ru, zh, ko, ja, es]
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Env
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-extra
          pip install deep-translator
          sudo gem install asciidoctor-pdf asciidoctor-pdf-cjk rouge

      - name: Process Language
        run: |
          mkdir -p pdf_outputs
          # Definimos el código de idioma en mayúsculas usando Bash normal
          LANG_UPPER=$(echo "${{ matrix.lang }}" | tr '[:lower:]' '[:upper:]')
          
          MODULES="local_fundamentals local_filesystem local_group local_network local_permissions local_scripts local_security local_services local_software local_storage local_system_data local_users"
          
          for MOD in $MODULES; do
            if [ -d "$MOD" ]; then
              mkdir -p "tmp_${{ matrix.lang }}/$MOD"
              cp -r "$MOD/"* "tmp_${{ matrix.lang }}/$MOD/"
              
              python3 .github/scripts/translate_adoc.py "$MOD" "tmp_${{ matrix.lang }}/$MOD" ${{ matrix.lang }}
              
              EXTRA=""
              [[ "${{ matrix.lang }}" =~ ^(zh|ko|ja)$ ]] && EXTRA="-a scripts=cjk -a lang=${{ matrix.lang }}"
              
              asciidoctor-pdf "tmp_${{ matrix.lang }}/$MOD/index.adoc" \
                -a pdf-theme=default -a pdf-fontsdir=/usr/share/fonts $EXTRA \
                -o "pdf_outputs/${LANG_UPPER}_${MOD}.pdf"
            fi
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.lang }}
          path: pdf_outputs/*.pdf

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_pdfs

      - name: Delete Old Data
        run: |
          RELEASES=$(gh release list --limit 100 | cut -f 1)
          for r in $RELEASES; do gh release delete "$r" -y --cleanup-tag || true; done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Multi-Releases
        run: |
          # Lista de idiomas
          LANGS="JA KO ZH RU PT DE EN FR"
          declare -A TITLES=( 
            ["JA"]="日本語のドキュメント 🇯🇵" 
            ["KO"]="한국어 문서 🇰🇷" 
            ["ZH"]="中文文档 🇨🇳" 
            ["RU"]="Документация на русском 🇷🇺" 
            ["PT"]="Documentação em Português 🇵🇹" 
            ["DE"]="Deutsche Dokumentation 🇩🇪" 
            ["EN"]="English Documentation 🇬🇧" 
            ["FR"]="Documentation Française 🇫🇷"
            ["ESP"]="Documentación en Español 🇪🇸" 
          )
          declare -A IMGS=(
            ["JA"]="released_JA.png" ["KO"]="released_KO.png" ["ZH"]="released_ZH.png"
            ["RU"]="released_RU.png" ["PT"]="released_PT.png" ["DE"]="released_DE.png"
            ["EN"]="released_ENG.png" ["FR"]="released_FR.png" ["ESP"]="released_ESP.png"
          )
          IMG_BASE="https://raw.githubusercontent.com/${{ github.repository }}/master/.github/media"
          for L in $LANGS; do
            FILES=$(find "all_pdfs/pdf-${L,,}" -name "*.pdf" 2>/dev/null)
            if [ -n "$FILES" ]; then
              NOTES="![Header]($IMG_BASE/${IMGS[$L]})\n\n## ${TITLES[$L]}\n\nContenido traducido automáticamente."
              gh release create "$L" $FILES --title "🔵 ${TITLES[$L]}" --notes "$NOTES"
              sleep 5
            fi
          done

          ESP_FILES=$(find all_pdfs/pdf-es -name "*.pdf")
          if [ -n "$ESP_FILES" ]; then
            NOTES="![Header]($IMG_BASE/${IMGS[ESP]})\n\n## ${TITLES[ESP]}\n\nManuales originales creados para la comunidad."
            gh release create "ESP" $ESP_FILES --title "🔵 ${TITLES[ESP]}" --notes "$NOTES"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}