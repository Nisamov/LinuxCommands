name: Generación de Documentación PDF Multilingüe

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [en, de, pt, ru, zh, ko, ja, es]
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Env
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-extra
          pip install deep-translator
          sudo gem install asciidoctor-pdf asciidoctor-pdf-cjk rouge

      - name: Process Language
        run: |
          mkdir -p pdf_outputs
          LANG_UPPER=$(echo "${{ matrix.lang }}" | tr '[:lower:]' '[:upper:]')
          
          # Módulos a procesar
          MODULES="local_fundamentals local_filesystem local_group local_network local_permissions local_scripts local_security local_services local_software local_storage local_system_data local_users"
          
          for MOD in $MODULES; do
            if [ -d "$MOD" ]; then
              mkdir -p "tmp_${{ matrix.lang }}/$MOD"
              cp -r "$MOD/"* "tmp_${{ matrix.lang }}/$MOD/"
              
              # Traducir (el script de python debe manejar si lang es 'es' para no traducir si no es necesario)
              python3 .github/scripts/translate_adoc.py "$MOD" "tmp_${{ matrix.lang }}/$MOD" ${{ matrix.lang }}
              
              EXTRA=""
              [[ "${{ matrix.lang }}" =~ ^(zh|ko|ja)$ ]] && EXTRA="-a scripts=cjk -a lang=${{ matrix.lang }}"
              
              asciidoctor-pdf "tmp_${{ matrix.lang }}/$MOD/index.adoc" \
                -a pdf-theme=default -a pdf-fontsdir=/usr/share/fonts $EXTRA \
                -o "pdf_outputs/${LANG_UPPER}_${MOD}.pdf"
            fi
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.lang }}
          path: pdf_outputs/*.pdf

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_pdfs

      - name: Eliminar tags
        run: |
          # Obtenemos la lista de todas las releases actuales
          RELEASES=$(gh release list --limit 100 | cut -f 1)
          for r in $RELEASES; do
            echo "Eliminando release y tag: $r"
            gh release delete "$r" -y --cleanup-tag || true
          done
          # Limpieza extra de tags remotos que puedan haber quedado huérfanos
          git fetch --tags
          TAGS=$(git tag)
          for t in $TAGS; do
            git push origin :refs/tags/"$t" || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear releases
        run: |
          # Lista de IDs de carpetas (el artifact se llama pdf-en, pdf-es, etc)
          # Los tags finales serán los de LANGS
          LANGS="JA KO ZH RU PT DE EN FR ESP"
          
          declare -A TITLES=( 
            ["JA"]="日本語のドキュメント 🇯🇵" ["KO"]="한국어 문서 🇰🇷" ["ZH"]="中文文档 🇨🇳" 
            ["RU"]="Документация na русском 🇷🇺" ["PT"]="Documentação em Português 🇵🇹" 
            ["DE"]="Deutsche Dokumentation 🇩🇪" ["EN"]="English Documentation 🇬🇧" 
            ["FR"]="Documentation Française 🇫🇷" ["ESP"]="Documentación en Español 🇪🇸" 
          )
          
          declare -A IMGS=(
            ["JA"]="released_JA.png" ["KO"]="released_KO.png" ["ZH"]="released_ZH.png"
            ["RU"]="released_RU.png" ["PT"]="released_PT.png" ["DE"]="released_DE.png"
            ["EN"]="released_ENG.png" ["FR"]="released_FR.png" ["ESP"]="released_ESP.png"
          )
          
          IMG_BASE="https://raw.githubusercontent.com/${{ github.repository }}/master/.github/media"

          for L in $LANGS; do
            # Mapeo de tag a nombre de carpeta de artifact
            if [ "$L" == "ESP" ]; then FOLDER_LANG="es"; else FOLDER_LANG="${L,,}"; fi
            
            # Buscar PDFs en la carpeta del artifact correspondiente
            FILES=$(find "all_pdfs/pdf-$FOLDER_LANG" -name "*.pdf" 2>/dev/null || true)
            
            if [ -n "$FILES" ]; then
              echo "--- Creando Release: $L ---"
              
              if [ "$L" == "ESP" ]; then
                DESC="Manuales originales creados para la comunidad."
              else
                DESC="Contenido traducido automáticamente."
              fi
              
              NOTES="![Header]($IMG_BASE/${IMGS[$L]})\n\n## ${TITLES[$L]}\n\n$DESC"
              
              # Intentar crear la release
              gh release create "$L" $FILES --title "🔵 ${TITLES[$L]}" --notes "$NOTES"
              
              # Espera mayor para evitar colisiones de API y asegurar que el tag se propague
              sleep 10
            else
              echo "No se encontraron archivos para $L en all_pdfs/pdf-$FOLDER_LANG"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}