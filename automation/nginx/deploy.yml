---
- name: Despliegue de NGINX con SSL (Configuración Nisamov)
  hosts: webservers
  become: yes
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Instalar NGINX y OpenSSL
      apt:
        name: 
          - nginx
          - openssl
        state: present
        update_cache: yes

    - name: Crear directorio de la web y asignar permisos
      file:
        path: "{{ web_root }}"
        state: directory
        mode: '0755'

    - name: Crear el index.html básico
      copy:
        dest: "{{ web_root }}/index.html"
        content: |
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Mi Página</title>
          </head>
          <body>
              <p>Contenido cuerpo de página</p>
          </body>
          </html>

    - name: Preparar directorio SSL
      file:
        path: "{{ ssl_cert_path }}"
        state: directory
        mode: '0700'

    - name: Generar clave privada y certificado (Genérico)
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:4096
        -keyout {{ ssl_cert_path }}/clave_privada.key
        -out {{ ssl_cert_path }}/certificado.crt
        -subj "/C=XX/ST=Default/L=Default/O=Infrastructure/CN={{ domain_name }}"
      args:
        creates: "{{ ssl_cert_path }}/certificado.crt"

    - name: Configurar VirtualHost de NGINX
      template:
        src: templates/nginx_vhost.j2
        dest: "/etc/nginx/sites-available/mipagina.es"
      notify: Reiniciar NGINX

    - name: Habilitar el sitio mediante enlace simbólico
      file:
        src: "/etc/nginx/sites-available/mipagina.es"
        dest: "/etc/nginx/sites-enabled/mipagina.es"
        state: link
      notify: Reiniciar NGINX

    - name: Eliminar el sitio default si existe
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reiniciar NGINX

  handlers:
    - name: Reiniciar NGINX
      service:
        name: nginx
        state: restarted