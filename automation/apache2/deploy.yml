---
- name: Despliegue de Apache2 (Configuración Nisamov)
  hosts: webservers
  become: yes
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Instalar Apache2 y OpenSSL
      apt:
        name: [apache2, openssl]
        state: present
        update_cache: yes

    - name: Crear estructura de directorios web
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      with_items:
        - "{{ web_root }}"
        - "{{ web_root }}/styles"
        - "{{ web_root }}/scripts"

    - name: Crear archivos estáticos (HTML, CSS, JS)
      copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
      with_items:
        - { dest: "{{ web_root }}/index.html", content: "<!DOCTYPE html><html>...</html>" }
        - { dest: "{{ web_root }}/styles/style.css", content: "body { background-color: #fefbd8; }" }
        - { dest: "{{ web_root }}/scripts/script.js", content: "console.log('Correcto');" }

    - name: Habilitar módulo SSL en Apache
      apache2_module:
        name: ssl
        state: present
      notify: Reiniciar Apache

    - name: Crear directorio para certificados
      file:
        path: "{{ cert_dir }}"
        state: directory
        mode: '0700'

    - name: Generar Certificado SSL (Autofirmado)
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:4096
        -keyout {{ cert_dir }}/apache.key
        -out {{ cert_dir }}/apache-certificado.crt
        -subj "/C=XX/ST=Default/L=Default/O=Infrastructure/CN={{ server_ip }}"
      args:
        creates: "{{ cert_dir }}/apache-certificado.crt"

    - name: Configurar VirtualHost (mipagina.es.conf)
      template:
        src: templates/apache_vhost.j2
        dest: "/etc/apache2/sites-available/{{ domain_name }}.conf"
      notify: Reiniciar Apache

    - name: Habilitar el sitio y deshabilitar el default
      command: a2ensite {{ domain_name }}.conf
      args:
        creates: "/etc/apache2/sites-enabled/{{ domain_name }}.conf"
      notify: Reiniciar Apache

    - name: Configurar /etc/hosts localmente
      lineinfile:
        path: /etc/hosts
        line: "{{ server_ip }} {{ domain_name }} www.{{ domain_name }}"
        state: present

    - name: Permitir AllowOverride All en apache2.conf
      blockinfile:
        path: /etc/apache2/apache2.conf
        block: |
          <Directory {{ web_root }}>
              AllowOverride All
          </Directory>

  handlers:
    - name: Reiniciar Apache
      service:
        name: apache2
        state: restarted